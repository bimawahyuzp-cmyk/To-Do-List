<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- Profile -->
  <header class="board-header">
    <div class="header-top">
      <span class="eyebrow">To Do List</span>
      <time class="clock" id="clockTime"></time>
    </div>

    <div class="profile" id="profileView">
      <div class="profile-info">
        <h1 class="profile-name" id="profileName">Nama Kamu</h1>
        <p class="profile-role" id="profileRole">Jabatan Kamu</p>
      </div>
      <button class="btn-ghost" id="editProfileBtn" aria-label="Edit profil">Edit</button>
    </div>

    <form class="profile-edit hidden" id="profileEditForm">
      <input type="text" id="inputName" placeholder="Nama" maxlength="40" autocomplete="off">
      <input type="text" id="inputRole" placeholder="Jabatan" maxlength="40" autocomplete="off">
      <button type="submit" class="btn-primary btn-sm">Simpan</button>
    </form>

    <p class="date-line" id="dateLine"></p>
  </header>

  <!-- Input Section -->
  <section class="composer">
    <form id="taskForm">
      <textarea id="taskInput" placeholder="Tulis tugas baru..." maxlength="200" rows="2" required></textarea>

      <div class="composer-row">
        <div class="priority-select" role="radiogroup" aria-label="Level prioritas">
          <button type="button" class="priority-pill" data-level="low" aria-pressed="false">
            <span class="signal signal-1"><i></i><i></i><i></i></span> Low
          </button>
          <button type="button" class="priority-pill" data-level="medium" aria-pressed="true">
            <span class="signal signal-2"><i></i><i></i><i></i></span> Medium
          </button>
          <button type="button" class="priority-pill" data-level="high" aria-pressed="false">
            <span class="signal signal-3"><i></i><i></i><i></i></span> High
          </button>
        </div>

        <div class="due-select">
          <label for="dueDate">Deadline</label>
          <input type="date" id="dueDate">
        </div>
      </div>

      <button type="submit" class="btn-primary btn-submit">+ Tambah Tugas</button>
    </form>
  </section>

  <!-- Board -->
  <section class="board">

    <div class="column" id="todoColumn">
      <div class="column-head">
        <h2>To Do</h2>
        <span class="count" id="todoCount">0</span>
      </div>
      <ul class="task-list" id="todoList"></ul>
      <p class="empty-state" id="todoEmpty">Belum ada tugas. Tambahkan satu di atas.</p>
    </div>

    <div class="column" id="doneColumn">
      <div class="column-head">
        <h2>Done</h2>
        <span class="count" id="doneCount">0</span>
      </div>
      <ul class="task-list" id="doneList"></ul>
      <p class="empty-state" id="doneEmpty">Belum ada yang selesai.</p>
    </div>

  </section>

  <footer class="board-footer">
    <button class="btn-danger" id="deleteAllBtn">Delete All</button>
  </footer>

</div>

<!-- Confirm Delete All -->
<div class="modal-overlay hidden" id="confirmModal">
  <div class="modal">
    <p class="modal-title">Hapus semua tugas?</p>
    <p class="modal-body">Semua task di To Do dan Done akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.</p>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelDeleteAll">Batal</button>
      <button class="btn-danger" id="confirmDeleteAll">Hapus Semua</button>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
